<style>
:root{
  --bg:#f2f4f6; --panel:#ffffff; --ink:#191f28; --ink2:#4e5968; --ink3:#6b7684; --line:#e5e8eb; --line2:#d1d6db; --hover:#f2f4f6;
  --accent:#2864dc; --accent-ink:#ffffff; --accent-soft:#e8f0fd;
  --pin:#e03131; --pin-ink:#ffffff;
  --z-wel:#f2a900; --z-med:#e64980; --z-grn:#2f9e44; --z-trn:#4c6ef5; --z-biz:#7950f2; --z-etc:#868e96;
  --out:#adb5bd;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:8px; --shadow:0 2px 10px rgba(25,31,40,.10);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101215; --panel:#1b1e23; --ink:#e9ecef; --ink2:#b0b8c1; --ink3:#8b95a1; --line:#2c3036; --line2:#3a3f46; --hover:#24282e;
  --accent:#5b8def; --accent-ink:#0b1220; --accent-soft:#1c2a44; --pin:#ff6b6b; --pin-ink:#1b0a0a; --out:#495057; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101215; --panel:#1b1e23; --ink:#e9ecef; --ink2:#b0b8c1; --ink3:#8b95a1; --line:#2c3036; --line2:#3a3f46; --hover:#24282e;
  --accent:#5b8def; --accent-ink:#0b1220; --accent-soft:#1c2a44; --pin:#ff6b6b; --pin-ink:#1b0a0a; --out:#495057; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{word-break:keep-all;overflow-wrap:break-word;background:var(--bg);color:var(--ink);font:400 14px/1.55 var(--sans);min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);-webkit-font-smoothing:antialiased}
::selection{background:var(--accent-soft)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.n{font-variant-numeric:tabular-nums}
.ex{display:inline-block;font-size:11px;line-height:18px;padding:0 6px;border-radius:4px;background:var(--hover);color:var(--ink3);margin-left:6px;vertical-align:1px;font-weight:500}
.v{display:inline-block;font-size:11px;line-height:18px;padding:0 6px;border-radius:4px;border:1px dashed var(--ink3);color:var(--ink2);font-weight:500}

/* 상단 바 */
.bar{display:grid;grid-template-columns:auto 1fr;align-items:stretch;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:1100}
.brand{display:flex;align-items:center;gap:10px;padding:0 20px}
.brand b{font-weight:700;font-size:16px;letter-spacing:-.02em;white-space:nowrap}
.brand span{font-size:12px;color:var(--ink3);white-space:nowrap}
.track{display:flex;overflow-x:auto;scrollbar-width:none;min-width:0;gap:2px;padding:0 8px}
.track button{flex:0 0 auto;height:52px;background:none;border:0;padding:0 12px;color:var(--ink3);border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px;white-space:nowrap}
.track button b{font-size:13.5px;font-weight:500}
.track button.done{color:var(--ink2)}
.track button.now{color:var(--accent);border-bottom-color:var(--accent)}
.track button.now b{font-weight:700}
.track button:hover{color:var(--ink)}

main{position:relative}
.foot{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;justify-content:space-between;padding:10px 20px;border-top:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--ink3)}
.foot .nav{display:flex;gap:6px}
.btn{border:1px solid var(--line2);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:var(--r);font-weight:500;transition:background .15s ease-out,border-color .15s}
.btn:hover{background:var(--hover)}

<div><span class="n">종료+30일</span><span>최종성과보고서(별지 제3호) · 원상복구 이행계획서 초안 · 실증확인서 발급 요청 안내</span></div></div><p class="fixed">시간 경과는 시나리오로 고정한다</p>`,
    6:`<h2>사람에게 넘김 · 10/8 — 규제·인증 확정<span class="ex">예시</span></h2><div class="row"><b>1번 후보(병원) 설치 — 의료기기 해당 여부를 확정해야 한다</b><span>넘기는 조건 (a) 규제·인증 확정 · 넘기는 장면은 시나리오로 고정</span></div>
<div class="row"><b>AI 1차 판단 — 해당 가능성 높음<span class="ex">예시</span></b><span>근거: 호흡·심박을 화면에 표시하면 생체신호 측정 목적으로 읽힐 수 있다. 낙상 알림만이면 가능성이 낮다.</span>
<span>함께 넘기는 것: 제품 사용 목적 정리 · 판단이 갈리는 기준 · 식약처 품목 분류 질의에 쓸 요약</span>
<span>사람에게 넘기는 이유: 틀리면 병원에 허가 없는 기기를 들이게 된다. AI는 판단 근거까지, <b>확정은 사람</b>이 한다.</span></div>
<div class="row"><span>상담 요약과 AI 1차 판단을 <b>바이오헬스 분야 실증 코디네이터</b>에게 넘긴다. 기업은 같은 창구에서 이어서 안내받는다. 경로당 건은 의료 현장이 아니라 그대로 진행한다.</span></div>
<p class="fixed">넘기는 조건은 넷 — 규제·인증 확정 / 후보 전부 거절 / 위험한 실증 / 기업이 사람을 요청</p>`
  }[s];
  const log = AILOG.slice(0, Math.min(s,6)+ (s<6?1:0)).map(([d,t],i,a)=>`<li class="${i===a.length-1&&!hand?"new":""}"><span class="n">${i+1}</span><span><span class="fixed">${d}</span> ${t}</span></li>`).join("");
  return `<div class="board"><div class="line"><div class="casehd"><b>내 실증 건</b><span>낙상 감지 센서 · 상시형 · 10/6 상담 시작 · 단계를 누르면 그때 기록을 본다</span><span class="ex">날짜는 시나리오</span></div><div class="rw"><div class="rail">${segs}${stns}
      ${hand?`<span class="branch" style="left:calc(${pos(3)}% - 1px)"></span><span class="human" style="left:${pos(3)}%">병원 건 → 사람 실증 코디네이터</span>`:""}
      <span class="case" style="left:${caseAt}%"><b>낙상 감지 센서</b> · ${s>=4?`<span class="chg">${ALT.name}</span>`:"관평1통경로당"} 외 1곳</span></div></div></div>
    <div class="work"><div class="detail">${detail}</div>
      <div class="lanes"><div class="lane"><h3>AI 코디네이터가 한 일<span class="ex">예시</span></h3><ol>${log}</ol></div>
      <div class="lane hu"><h3>사람에게 넘긴 일<span class="ex">시나리오로 고정</span></h3>${s>=3?`<ol><li class="${s===3||hand?"new":""}"><span class="n">1</span><span><span class="fixed">10/8</span> 병원 건 의료기기 해당 여부 확정(AI 1차 판단 첨부) → 바이오헬스 분야 실증 코디네이터</span></li></ol>`:`<p class="empty">아직 없음. 넘기는 조건 넷 중 하나일 때만 넘긴다.</p>`}</div></div></div></div>`;
}

function Duo(){
  const real = {}; R.forEach(r=>{ real[M[r[0]]]=(real[M[r[0]]]||0)+1; }); real["장비(대전TP)"]=400;
  const rows = Object.keys(VREQ).map(k=>[k, real[k]||0, st.dash[k]]).sort((a,b)=>b[2]-a[2]);
  const mx = Math.max(...rows.map(r=>Math.max(r[1],r[2]))); const sc=v=>Math.max(1,Math.sqrt(v/mx)*100);
  const body = rows.map(r=>`<div class="dr ${r[2]>r[1]*3?"hot":""} ${st.flash===r[0]?"flash":""}" data-k="${r[0]}"><span class="lab">${r[0]}</span>
     <span class="bars"><span class="b1" style="width:${sc(r[1])}%"></span><span class="b2" style="width:${sc(r[2])}%"></span></span>
     <span class="n">${fmt(r[1])}</span><span class="n q">${r[2]}</span></div>`).join("");
  return `<div class="duo"><section class="side"><h2>기관 쪽 화면</h2><div class="who">유성구 사회돌봄과 · 실증 협의 받은 함</div>
      <div class="inbox"><div class="ih"><span>받은 요청 1건 · 첫 실증 연결소 경유</span><span>정리된 요청서<span class="ex">예시</span></span></div>
      <dl><dt>요청 기업</dt><dd>대전 ○○ 스타트업 (가상 기업)</dd><dt>제품</dt><dd>레이더 기반 비접촉 낙상 감지 센서</dd>
      <dt>희망 현장</dt><dd>${ALT.name} (실증자원 #${ALT.seq})</dd><dt>기간·설치</dt><dd>3개월 · 벽면 2대 · 공사 없음</dd>
      <dt>원상복구</dt><dd>철거 후 원상태 확인</dd><dt>확인 필요</dt><dd>없음 — 의료기기 해당 여부 확정은 병원 건에서 사람 코디네이터가 맡음</dd></dl>
      <div class="ia"><button class="btn sm go">협의 가능 회신</button><button class="btn sm">일정 조정 요청</button></div></div>
      <p class="fixed">기관은 같은 형식의 요청서를 받는다 — 기업마다 다른 메일을 해석하지 않아도 된다.</p></section>
    <section class="side"><h2>운영자 화면 — 현장 유형별 실증 수요</h2><div class="who">대전시·대전TP · 실증자원 수는 실제(djtb 2026-10, 장비는 대전TP 보유장비 CSV) · 요청 수는 <span class="v">시연용 가상 데이터</span></div>
      <div class="demand" id="demand"><div class="dr hd"><span>현장 유형</span><span>막대: 회색 실제 자원 / 파랑 요청 (제곱근 축)</span><span style="text-align:right">자원</span><span style="text-align:right">요청</span></div>${body}</div>
      <p style="margin:0"><button class="btn sm" data-act="req">요청 1건 들어옴 (시연)</button></p>
      <div class="note"><b>의료시설 — 요청 ${st.dash["의료시설"]}건, 등록 자원 ${real["의료시설"]}곳 <span class="v">가상 요청 기준</span></b>
      <span>노인병원·요양병원 쪽 실증자원 확충 후보. 운영 측은 「분야별로는 따로 집계하지 않는다」고 답했다 — 이 화면이 그 빈칸이다.</span></div></section></div>`;
}

let timer=null;
function runFunnel(){ clearTimeout(timer); st.step=0; st.sel=null; st.cart=[]; render(true);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const tick=()=>{ st.step++; render(st.step>=LAYERS.length?true:undefined); if(st.step<LAYERS.length) timer=setTimeout(tick, reduce?0:900); };
  timer=setTimeout(tick, reduce?0:500); }

function render(fly){
  const s=st.s;
  $("#track").innerHTML = SCENES.map((x,i)=>`<button data-s="${i}" class="${i<s?"done":i===s?"now":""}" aria-current="${i===s?"step":"false"}"><b>${i<7?"①②③④⑤⑥⑦"[i]+" ":""}${x}</b></button>`).join("");
  const V = s<=1?Atlas: s===2?Papers: s<=6?Board: Duo;
  document.body.appendChild(host); host.style.display="none";
  $("#main").innerHTML = V();
  const slot=$(".mapslot");
  if(slot){ host.style.display=""; slot.appendChild(host); if(!map) initMap(); map.invalidateSize(); paintMap(fly); }
  const mini=$("#mini"); if(mini) miniMap(mini);
  const tr=$("#track"), tn=$("#track .now"); // 좁은 화면에서 현재 탭과 현재 단계를 가운데로
  tr.scrollLeft += tn.getBoundingClientRect().left - tr.getBoundingClientRect().left - (tr.clientWidth - tn.offsetWidth)/2;
  const ln=$(".rw"), cs=$(".human")||$(".case");
  if(ln&&cs) ln.scrollLeft = cs.offsetLeft - ln.clientWidth/2;
  $("#prev").disabled = s===0; $("#next").disabled = s===7;
  try{ history.replaceState(null,"","#s"+s) }catch(e){}
}
function typeProduct(){ if(st.typed) return; st.typed=1; render();
  const out=$("#q"), reduce=matchMedia("(prefers-reduced-motion: reduce)").matches; let n=0;
  const tick=()=>{ n++; out.textContent=PRODUCT.slice(0,n); if(n<PRODUCT.length) timer=setTimeout(tick,reduce?0:38); else timer=setTimeout(()=>{ st.typed=2; render(); },reduce?0:350); };
  tick(); }
// ① 안에서는 「다음」이 입력 → 답 하나씩 → 현장 찾기 순으로 넘긴다 (녹화용)
function stepConsult(){ if(st.typed===0) return typeProduct(); if(st.typed===1) return;
  if(st.ans<QS.length){ st.ans++; return render(); } go(1); }
function go(n){ if(st.s===0 && n===1 && (st.typed<2 || st.ans<QS.length)) return stepConsult();
  const was=st.s; st.s=Math.max(0,Math.min(7,n)); clearTimeout(timer); st.sel=null;
  if(st.s>=1){ st.typed=2; st.ans=QS.length; }
  if(st.s>=2 && !st.cart.length) st.cart=[...PLAN];
  if(st.s===1 && was===0) return runFunnel();
  if(st.s===0) st.step=0; else if(st.s>=1 && st.step<LAYERS.length) st.step=LAYERS.length;
  render((st.s===2||st.s===0) && was===1 ? true : st.s<=2 && was!==st.s ? false : undefined); }
document.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.s){ const n=+b.dataset.s; if(n>=1){ clearTimeout(timer); st.typed=2; st.ans=QS.length; } go(n); } // 장면 막대는 바로 이동
  else if(b.id==="prev") go(st.s-1); else if(b.id==="next") go(st.s+1);
  else if(b.dataset.act==="find") go(1);
  else if(b.dataset.act==="type") typeProduct();
  else if(b.dataset.act==="answer") stepConsult();
  else if(b.dataset.act==="replay") runFunnel();
  else if(b.dataset.act==="pick") showPlace(+b.dataset.k,true);
  else if(b.dataset.act==="close"){ const k=st.sel; showPlace(null); const f=pinM[k]&&pinM[k].getElement(); if(f) f.focus(); }
  else if(b.dataset.act==="plan") go(2);
  else if(b.dataset.act==="cart") toggleCart(+b.dataset.k);
  else if(b.dataset.act==="req"){ // 순위가 제자리에서 움직이도록 FLIP
    const box=$("#demand"), before={}; box.querySelectorAll(".dr[data-k]").forEach(r=>before[r.dataset.k]=r.getBoundingClientRect().top);
    st.dash["복지시설"]++; st.dash["의료시설"]+=2; st.flash="의료시설"; render();
    document.querySelectorAll("#demand .dr[data-k]").forEach(r=>{ const d=before[r.dataset.k]-r.getBoundingClientRect().top; if(!d) return;
      r.animate([{transform:`translateY(${d}px)`},{transform:"none"}],{duration:450,easing:"cubic-bezier(.16,1,.3,1)"}); });
  }
});
document.addEventListener("keydown",e=>{ if(e.altKey||e.ctrlKey||e.metaKey||e.target.closest?.(".leaflet-container,.rw,.tw,input,textarea,[contenteditable]")) return;
  if(e.key==="Escape" && st.sel!==null){ showPlace(null); return; }
  if(e.key==="ArrowRight") go(st.s+1); if(e.key==="ArrowLeft") go(st.s-1); });
render(false);
</script>
